name: Update README cards

on:
  schedule:
    - cron: "15 0 * * *"   # every day, 00:15 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/render_readme_cards.py"
      - "assets/**"
      - "fonts/**"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pillow

      - name: Fetch contributions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME_GH: Abhik004
        run: python scripts/fetch_contributions.py

      - name: Render README cards (hero, tiles, activity, blue graph)
        run: python scripts/render_readme_cards.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards data
          git diff --cached --quiet || git commit -m "chore: refresh README cards"
          git push
