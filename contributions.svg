<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="205" viewBox="0 0 1200 205"><title>GitHub contribution heatmap</title><rect width="1200" height="205" rx="18" fill="#F5F4F0"/><text x="42" y="45" font-family="Georgia" font-size="31" fill="#171717">Every day, <tspan font-style="italic" fill="#3155F5">in blue.</tspan></text><text x="42" y="95" font-family="Arial" font-size="16" fill="#777">Your contribution calendar will appear after the first workflow run.</text></svg>