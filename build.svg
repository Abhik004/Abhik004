<svg xmlns="http://www.w3.org/2000/svg" width="390" height="250" viewBox="0 0 390 250" role="img" aria-label="BUILD: Make it real"><title>BUILD: Make it real</title>
<defs><style>
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,monospace}.serif{font-family:Georgia,"Times New Roman",serif}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.rise{animation:rise .8s cubic-bezier(.2,.8,.2,1) both}.bar{transform-box:fill-box;transform-origin:bottom;animation:grow .9s ease both}.pulse{animation:pulse 2.4s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></defs><rect width="390" height="250" rx="18" fill="#3155F5"/><text x="28" y="42" class="mono" font-size="12" letter-spacing="2" fill="#FFFFFF">BUILD</text><text x="28" y="100" class="serif" font-size="42" fill="#FFFFFF">Make it real</text><text x="30" y="145" font-size="15" fill="#FFFFFF">AI / ML · Data Science</text><text x="30" y="170" font-size="15" fill="#FFFFFF">Full-stack applications</text><text x="30" y="195" font-size="15" fill="#FFFFFF">Python · TypeScript · C++</text><circle cx="344" cy="42" r="9" fill="none" stroke="#FFFFFF" class="pulse"/><path d="M28 220H362" stroke="#FFFFFF" opacity=".35"/><text x="28" y="239" class="mono" font-size="10" fill="#FFFFFF">01 / ABHIK SAMANTA</text></svg>
